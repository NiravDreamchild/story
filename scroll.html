<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bedtime Scroll</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --night-1:#0d1230; --night-2:#1a2156; --night-3:#2b2a6b;
  --text:#efe7d6; --muted:#b9b4d6; --gold:#f2c46d; --gold-2:#c8912f;
  --card:rgba(255,255,255,.055); --card-line:rgba(242,196,109,.22);
  --parch:#f4e3bd; --parch-d:#d9bd84; --maroon:#7d2316;
  --fs:19px;
  --loader-bg:#0d1230; --loader-fg:#f2c46d; --loader-accent:#f2c46d; --loader-accent-fg:#2a1a05;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--night-1)}
body{font-family:'Hind Vadodara',sans-serif;color:var(--text);min-height:100%;
  background:linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 40%,var(--night-3) 85%,#3a2a5e 100%);
  overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d,3s) var(--dl,0s) infinite ease-in-out}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}

/* reading progress + font size */
.topbar{position:fixed;z-index:30;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 3px);pointer-events:none}
.topbar i{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--gold-2),var(--gold));box-shadow:0 0 10px var(--gold)}
.size{position:fixed;z-index:30;right:12px;top:calc(env(safe-area-inset-top) + 12px);display:flex;border-radius:999px;overflow:hidden;
  background:rgba(13,18,48,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--card-line)}
.size button{font-family:'Hind Vadodara',sans-serif;font-weight:700;border:0;background:none;color:var(--gold);width:40px;height:36px;cursor:pointer}
.size button:first-child{font-size:14px;border-right:1px solid var(--card-line)}
.size button:last-child{font-size:20px}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px calc(env(safe-area-inset-bottom) + 40px)}

/* hero */
.hero{min-height:88vh;min-height:88svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top) + 60px) 6px 40px;position:relative}
.moon{width:120px;height:120px;filter:drop-shadow(0 0 40px rgba(255,225,150,.55));animation:float 6s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-8px) rotate(-4deg)}}
.label{font-family:'Hind Vadodara',sans-serif;font-weight:600;color:var(--gold);font-size:14px;margin-top:22px}
.hero h1{font-family:'Hind Vadodara',sans-serif;font-weight:700;font-size:clamp(34px,10vw,58px);line-height:1.15;margin-top:8px;
  background:linear-gradient(180deg,#fff6dc,#f2c46d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 18px rgba(242,196,109,.25))}
.divider{width:160px;height:18px;color:var(--gold);margin-top:18px;opacity:.85}
.down{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--muted);font-size:13px;font-family:'Hind Vadodara',sans-serif;text-decoration:none}
.down svg{width:22px;height:22px;animation:bounce 1.8s infinite}
@keyframes bounce{50%{transform:translateY(6px)}}

/* chapters with a dotted timeline */
.chapters{position:relative;padding-left:0}
.chapter{position:relative;padding:8px 0 46px}
.chapter::before{content:"";position:absolute;left:50%;top:-30px;height:34px;border-left:2px dotted rgba(242,196,109,.45)}
.chapter:first-child::before{display:none}
.num{position:relative;margin:0 auto 16px;width:52px;height:52px;display:grid;place-items:center}
.num::before{content:"";position:absolute;inset:6px;transform:rotate(45deg);border-radius:8px;
  background:linear-gradient(135deg,#ffe1a1,#c8912f);box-shadow:0 0 18px rgba(242,196,109,.45)}
.num span{position:relative;font-family:'Hind Vadodara',sans-serif;font-weight:700;font-size:20px;color:#3a2207;padding-top:3px}
.pic{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:#20265e;
  box-shadow:0 0 0 1px rgba(242,196,109,.5),0 0 0 6px rgba(242,196,109,.08),0 18px 40px rgba(0,0,0,.45)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.text{margin-top:-14px;position:relative;background:var(--card);border:1px solid var(--card-line);border-top:none;
  border-radius:0 0 18px 18px;padding:30px 20px 22px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.text p{font-size:var(--fs);line-height:1.85;color:var(--text);font-weight:400}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
.reveal .pic img{transform:scale(1.08);transition:transform 1.6s ease}
.reveal.in .pic img{transform:none}

/* moral: rolled parchment scroll */
.moral{position:relative;margin:20px 8px 0;padding:6px 0}
.roll{height:22px;border-radius:11px;position:relative;z-index:2;
  background:linear-gradient(180deg,#a3743a,#f0d79f 35%,#c99a55 60%,#7e5426);box-shadow:0 6px 12px rgba(0,0,0,.35)}
.roll::before,.roll::after{content:"";position:absolute;top:-4px;width:16px;height:30px;border-radius:6px;background:linear-gradient(180deg,#6e1d16,#a8322a 45%,#4a110d)}
.roll::before{left:-10px}.roll::after{right:-10px}
.parch{margin:0 10px;padding:28px 22px 30px;text-align:center;color:#3e2510;
  background:
    radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(140,90,30,.25) 100%),
    linear-gradient(180deg,rgba(120,80,30,.25),transparent 8%,transparent 92%,rgba(120,80,30,.25)),
    var(--parch);
  box-shadow:inset 0 0 30px rgba(150,100,40,.25)}
.parch h2{font-family:'Hind Vadodara',sans-serif;font-weight:700;color:var(--maroon);font-size:32px;line-height:1.1;display:flex;align-items:center;justify-content:center;gap:10px}
.parch h2 svg{width:30px;height:30px}
.parch .divider{color:var(--gold-2);margin:10px auto 14px}
.parch p{font-size:calc(var(--fs) + 2px);line-height:1.75;font-weight:600}
.end{text-align:center;margin-top:46px;font-family:'Hind Vadodara',sans-serif}
.end .word{font-size:26px;font-weight:700;color:var(--gold)}
.end .stars{color:var(--gold);opacity:.8;margin:8px 0 20px;display:flex;justify-content:center;gap:14px}
.end .stars svg{width:12px;height:12px}
.end .stars svg:nth-child(2){width:16px;height:16px;margin-top:-2px}
.again{display:inline-flex;align-items:center;gap:8px;font-family:'Hind Vadodara',sans-serif;font-weight:700;font-size:16px;color:#2a1a05;border:0;cursor:pointer;
  padding:11px 24px 8px;border-radius:999px;background:linear-gradient(180deg,#ffe1a1,#d9a443);box-shadow:0 0 22px rgba(242,196,109,.35)}

.again .ico{width:17px;height:17px;margin-top:-2px}
@media (min-width:760px){
  .text{padding:34px 34px 28px}
  :root{--fs:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<div class="topbar"><i id="bar"></i></div>
<div class="size"><button id="smaller" aria-label="Smaller text">અ-</button><button id="bigger" aria-label="Bigger text">અ+</button></div>
<main id="main"></main>

<script>
/*
 * Where the stories live.
 *   book.html?type=pregnant&day=29  →  <baseUrl>Pregnant/29/story.json + 1.jpg … 6.jpg
 *   book.html?type=planning&day=12  →  <baseUrl>Planning/12/story.json + 1.jpg … 6.jpg
 * baseUrl : "stories/" (inside the app) or "https://your-cdn/stories/"
 * version : change it after editing JSON on a CDN so phones skip the old cached copy
 * Folder names are case-sensitive.
 */
window.STORY_CONFIG = {
  "baseUrl": "stories/",
  "jsonName": "story.json",
  "imageExt": "jpg",
  "version": "",
  "collections": {
    "planning": { "folder": "Planning", "first": 1,  "last": 84 },
    "pregnant": { "folder": "Pregnant", "first": 29, "last": 280 }
  }
};

/* Gujarati UI labels used by book.html, cards.html and scroll.html */
window.STORY_UI = window.STORY_UI || {
  storyTag: "વાર્તા",
  part: "ભાગ",
  start: "વાર્તા શરૂ કરીએ",
  readAgain: "ફરી વાંચો",
  theEnd: "સમાપ્ત",
  tapHint: "પાનું ફેરવવા ટેપ કરો",
  scrollHint: "નીચે સ્ક્રોલ કરો",
  moralLabel: "બોધ",
  loading: "વાર્તા ખૂલી રહી છે…",
  notAvailable: "આ દિવસની વાર્તા હજી ઉપલબ્ધ નથી.",
  networkError: "વાર્તા લોડ થઈ શકી નથી. ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો.",
  retry: "ફરી પ્રયાસ કરો"
};
</script>
<script>
/*
 * Loads the story for ?type=…&day=… and hands it to the page.
 *   Link:   book.html?type=pregnant&day=29
 *   App:    openStory("pregnant", 29)          page reads the JSON itself
 *           openStory("pregnant", 29, json)    app passes the JSON (needed when files are local on the phone)
 *   Events: window.onStoryEvent = function(name, info){}   "loaded" {collection, day, title} | "error" {code}
 * story.json: { "title": "…", "moral": "…", "pages": ["para 1", … "para 6"] }  →  para N uses N.jpg
 */
(function () {
  var C = window.STORY_CONFIG || {};
  var UI = window.STORY_UI || {};
  var render = null, overlay = null, token = 0, last = null;

  function E(code, detail) { var e = new Error(code); e.code = code; e.detail = detail; return e; }

  function findCollection(type) {
    if (type == null) return null;
    var cols = C.collections || {}, t = String(type).trim().toLowerCase();
    for (var k in cols) {
      if (k.toLowerCase() === t || String(cols[k].folder).toLowerCase() === t) return cols[k];
    }
    return null;
  }

  function dayFolder(col, day) {
    var b = C.baseUrl || '';
    if (b && b.charAt(b.length - 1) !== '/') b += '/';
    return b + encodeURIComponent(col.folder) + '/' + day + '/';
  }

  function isAbsolute(p) { return /^([a-z][a-z0-9+.-]*:|\/)/i.test(p); }

  // turn whatever the JSON contains into the shape the templates expect
  function normalize(data, col, day) {
    if (!data || typeof data !== 'object') throw E('notready');
    var dir = col ? dayFolder(col, day) : '';
    var ext = C.imageExt || 'jpg';
    var pages = (data.pages || []).map(function (p, i) {
      if (typeof p === 'string') p = { text: p };
      p = p || {};
      var img = p.square || p.image || ((i + 1) + '.' + ext);
      if (dir && !isAbsolute(img)) img = dir + img;
      return { square: img, text: String(p.text || '').trim() };
    });
    var title = String(data.title || '').trim();
    var moral = String(data.moral || '').trim();
    if (!title || !moral || !pages.length || pages.some(function (p) { return !p.text; })) throw E('notready');
    return {
      title: title,
      moral: moral,
      moralLabel: data.moralLabel || UI.moralLabel || 'બોધ',
      pages: pages,
      collection: col ? col.folder : null,
      day: col ? day : null
    };
  }

  // XHR rather than fetch: XHR can also read file:// when the WebView allows it
  function getJSON(url, cb) {
    var x = new XMLHttpRequest();
    try { x.open('GET', url, true); } catch (e) { cb(E('network', url)); return; }
    x.timeout = 15000;
    x.onload = function () {
      var ok = x.status === 200 || (x.status === 0 && x.responseText);
      if (!ok) { cb(E(x.status === 404 ? 'notfound' : 'network', url + ' (HTTP ' + x.status + ')')); return; }
      var json;
      try { json = JSON.parse(x.responseText); } catch (e) { cb(E('badjson', url)); return; }
      cb(null, json);
    };
    x.onerror = x.ontimeout = function () { cb(E('network', url)); };
    x.send();
  }

  function preload(src, cb) {
    var done = false, im = new Image();
    function go() { if (!done) { done = true; cb(); } }
    im.onload = im.onerror = go;
    setTimeout(go, 4000);
    im.src = src;
  }

  /* ---------- loading / error screen ---------- */
  var CSS =
    '.sl-ov{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;' +
    'padding:24px;text-align:center;background:var(--loader-bg,#1b1230);color:var(--loader-fg,#fff);font-family:\'Hind Vadodara\',sans-serif;transition:opacity .35s}' +
    '.sl-ov.sl-hide{opacity:0;pointer-events:none}' +
    '.sl-spin{width:42px;height:42px;border-radius:50%;border:4px solid currentColor;border-right-color:transparent;opacity:.75;animation:slspin .9s linear infinite}' +
    '@keyframes slspin{to{transform:rotate(360deg)}}' +
    '.sl-ico{width:56px;height:56px;opacity:.85}' +
    '.sl-msg{font-size:18px;font-weight:600;line-height:1.55;max-width:320px}' +
    '.sl-btn{font-family:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:10px 24px 8px;cursor:pointer;' +
    'background:var(--loader-accent,#ffd23f);color:var(--loader-accent-fg,#3a2200)}';
  var BOOK_ICO = '<svg class="sl-ico" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M28 14c-5-4-12-5-20-4v32c8-1 15 0 20 4 5-4 12-5 20-4V10c-8-1-15 0-20 4z"/><path d="M28 14v32"/></svg>';

  function ensureOverlay() {
    if (overlay) return overlay;
    var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    overlay = document.createElement('div'); overlay.className = 'sl-ov sl-hide';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function (e) {
      if (e.target.closest('[data-retry]') && last) open(last[0], last[1], last[2]);
    });
    return overlay;
  }
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function showLoading() {
    var o = ensureOverlay();
    o.innerHTML = '<div class="sl-spin"></div><div class="sl-msg">' + esc(UI.loading || 'વાર્તા ખૂલી રહી છે…') + '</div>';
    o.classList.remove('sl-hide');
  }
  function hideOverlay() { if (overlay) overlay.classList.add('sl-hide'); }
  function fail(err) {
    var code = err.code || 'network';
    if (window.console) console.warn('[story] ' + code + (err.detail ? ': ' + err.detail : ''));
    var o = ensureOverlay();
    var msg = code === 'network' ? (UI.networkError || 'વાર્તા લોડ થઈ શકી નથી. ઇન્ટરનેટ કનેક્શન તપાસો અને ફરી પ્રયાસ કરો.')
                                 : (UI.notAvailable || 'આ દિવસની વાર્તા હજી ઉપલબ્ધ નથી.');
    o.innerHTML = BOOK_ICO + '<div class="sl-msg">' + esc(msg) + '</div>' +
      (code === 'network' ? '<button class="sl-btn" data-retry>' + esc(UI.retry || 'ફરી પ્રયાસ કરો') + '</button>' : '');
    o.classList.remove('sl-hide');
    notify('error', { code: code });
  }

  // optional hook for the host app: window.onStoryEvent = function(name, info){…}
  function notify(name, info) { try { if (typeof window.onStoryEvent === 'function') window.onStoryEvent(name, info || {}); } catch (e) {} }

  function finish(json, col, day, my) {
    var s;
    try { s = normalize(json, col, day); } catch (e) { fail(e); return; }
    preload(s.pages[0].square, function () {
      if (my !== token) return;              // a newer request took over
      render(s); hideOverlay();
      notify('loaded', { collection: s.collection, day: s.day, title: s.title });
    });
  }

  function open(type, day, data) {
    last = [type, day, data];
    var my = ++token;
    var col = findCollection(type), ds = String(day == null ? '' : day).trim(), d = parseInt(ds, 10);
    if (!col) { fail(E('notfound', 'unknown type "' + type + '"')); return; }
    if (!/^\d+$/.test(ds) || d < col.first || d > col.last) {
      fail(E('notfound', col.folder + ' day "' + day + '" is outside ' + col.first + '–' + col.last)); return;
    }
    showLoading();
    if (data != null) {
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { fail(E('badjson', 'openStory data')); return; } }
      finish(data, col, d, my); return;
    }
    var url = dayFolder(col, d) + (C.jsonName || 'story.json') + (C.version ? '?v=' + encodeURIComponent(C.version) : '');
    getJSON(url, function (err, json) {
      if (my !== token) return;
      if (err) { fail(err); return; }
      finish(json, col, d, my);
    });
  }

  window.openStory = open;
  window.StoryLoader = {
    normalize: normalize,
    start: function (renderFn) {
      render = renderFn;
      // the old window.renderStory(fullObject) still works and clears any loader screen
      window.renderStory = function (d) { window.__storyRendered = true; hideOverlay(); return renderFn(d); };
      var q = {};
      location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
        if (!kv) return; var i = kv.indexOf('=');
        var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i)), v = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
        q[k.toLowerCase()] = v;
      });
      if (q.type != null || q.day != null) open(q.type, q.day);
      else if (window.STORY) render(normalize(window.STORY, null, null));
      else if (!window.__storyRendered) setTimeout(function () {   // no day given and the app hasn't called openStory()
        if (!token && !window.__storyRendered) fail(E('notfound', 'no ?type=&day= in the link'));
      }, 1500);
    }
  };
})();
</script>
<script>
(function(){
  var main=document.getElementById('main'), bar=document.getElementById('bar'), S, UI, io;
  var MOON='<svg viewBox="0 0 120 120"><defs><radialGradient id="mg" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff8dc"/><stop offset=".7" stop-color="#f6d58a"/><stop offset="1" stop-color="#d9a443"/></radialGradient></defs><path d="M78 12a50 50 0 1 0 30 70A42 42 0 0 1 78 12z" fill="url(#mg)"/><circle cx="46" cy="58" r="6" fill="#d9a443" opacity=".35"/><circle cx="58" cy="86" r="4" fill="#d9a443" opacity=".3"/><circle cx="34" cy="80" r="3" fill="#d9a443" opacity=".3"/></svg>';
  var DIV='<svg class="divider" viewBox="0 0 160 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M4 9h52M104 9h52"/><path d="M80 2l7 7-7 7-7-7z" fill="currentColor" fill-opacity=".35"/><circle cx="64" cy="9" r="2" fill="currentColor"/><circle cx="96" cy="9" r="2" fill="currentColor"/></svg>';
  var BULB='<svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 4a8 8 0 0 0-5 14c1 1 1.5 2 1.5 3.5h7c0-1.5.5-2.5 1.5-3.5A8 8 0 0 0 15 4z" fill="#f2c46d" fill-opacity=".5"/><path d="M12 25h6"/></svg>';
  var STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></svg>';
  var UP='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}

  function stars(){
    var sky=document.getElementById('sky'), h='';
    for(var i=0;i<70;i++){
      var s=Math.random()*2+0.6;
      h+='<span class="star" style="left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;opacity:'+(.35+Math.random()*.6)+';--d:'+(2+Math.random()*4)+'s;--dl:'+(Math.random()*4)+'s"></span>';
    }
    sky.innerHTML=h;
  }

  function build(){
    var n=S.pages.length, h='';
    h+='<header class="hero"><div class="moon">'+MOON+'</div><div class="label">'+esc(UI.storyTag)+'</div>'+
       '<h1>'+esc(S.title)+'</h1>'+DIV+
       '<a class="down" href="#c1">'+esc(UI.scrollHint)+'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></a></header>';
    h+='<section class="chapters">';
    S.pages.forEach(function(p,i){
      h+='<article class="chapter reveal" id="c'+(i+1)+'"><div class="num"><span>'+(i+1)+'</span></div>'+
         '<div class="pic"><img src="'+esc(p.square)+'" alt="" loading="'+(i<2?'eager':'lazy')+'"></div>'+
         '<div class="text"><p>'+esc(p.text)+'</p></div></article>';
    });
    h+='</section>';
    h+='<section class="moral reveal"><div class="roll"></div><div class="parch"><h2>'+BULB+esc(S.moralLabel||'બોધ')+'</h2>'+DIV+
       '<p>'+esc(S.moral)+'</p></div><div class="roll"></div></section>';
    h+='<footer class="end reveal"><div class="word">'+esc(UI.theEnd)+'</div><div class="stars">'+STAR+STAR+STAR+'</div>'+
       '<button class="again" id="again">'+UP+esc(UI.readAgain)+'</button></footer>';
    main.innerHTML=h;
    document.getElementById('again').onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
    if(io) io.disconnect();
    if('IntersectionObserver' in window){
      io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
      main.querySelectorAll('.reveal').forEach(function(el){io.observe(el)});
    } else main.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in')});
    progress();
  }

  function progress(){
    var max=document.documentElement.scrollHeight-window.innerHeight;
    bar.style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%';
  }
  window.addEventListener('scroll',progress,{passive:true});
  window.addEventListener('resize',progress);

  // text size (remembered per device when storage is available)
  var root=document.documentElement, base=parseFloat(getComputedStyle(root).getPropertyValue('--fs'))||19, step=0;
  try{ step=parseInt(localStorage.getItem('story-fs-step')||'0',10)||0 }catch(e){}
  function setSize(){ root.style.setProperty('--fs',(base+step*2)+'px'); try{localStorage.setItem('story-fs-step',step)}catch(e){} progress(); }
  document.getElementById('smaller').onclick=function(){ if(step>-2){step--;setSize()} };
  document.getElementById('bigger').onclick=function(){ if(step<4){step++;setSize()} };
  if(step) setSize();

  window.renderStory=function(data){ if(data) window.STORY=data; S=window.STORY; UI=window.STORY_UI; build(); window.scrollTo(0,0); };
  stars(); StoryLoader.start(window.renderStory);
})();
</script>
</body>
</html>
